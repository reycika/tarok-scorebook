<!doctype html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tarok beležka</title>
  <meta name="description" content="Beležka za vodenje rezultatov pri taroku" />

  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#1C2B45" />

  <!-- iOS "add to home screen" support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tarok" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="icon" href="./icon-192.png" />

  <style>
    html, body { margin: 0; padding: 0; background: #F4EFE4; }
    #root { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="./bundle.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./service-worker.js")
          .then((reg) => {
            // force an update check on every load instead of waiting for
            // the browser's own (sometimes slow/throttled) update cycle
            reg.update().catch(() => {});
            // if a new worker takes over while this tab is open, reload
            // once so the fresh bundle.js actually gets used
            let reloaded = false;
            navigator.serviceWorker.addEventListener("controllerchange", () => {
              if (reloaded) return;
              reloaded = true;
              window.location.reload();
            });
          })
          .catch(() => {});
      });
    }
  </script>
</body>
</html>
